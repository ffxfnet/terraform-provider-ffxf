name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: opentofu/setup-opentofu@v1

      - name: Check Go formatting
        run: test -z "$(gofmt -l .)"

      - name: Run Go vet
        run: go vet ./...

      - name: Run Go tests and check coverage
        run: |
          coverage_file="$(mktemp)"
          trap 'rm -f "$coverage_file"' EXIT
          go test ./... -coverprofile="$coverage_file"
          coverage_report="$(go tool cover -func="$coverage_file")"
          printf '%s\n' "$coverage_report"
          total_coverage="$(printf '%s\n' "$coverage_report" | awk '$1 == "total:" { gsub(/%/, "", $3); print $3 }')"
          echo "Total statement coverage: ${total_coverage}% (minimum 80%)"
          awk -v coverage="$total_coverage" 'BEGIN { if (coverage < 80) exit 1 }' || {
            echo "Coverage is below the required 80%."
            exit 1
          }

      - name: Check OpenTofu example formatting
        run: tofu fmt -check -recursive examples