name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: opentofu/setup-opentofu@v1

      - name: Check Go formatting
        run: test -z "$(gofmt -l .)"

      - name: Run Go vet
        run: go vet ./...

      - name: Run Go tests
        run: go test ./...

      - name: Check OpenTofu example formatting
        run: tofu fmt -check -recursive examples